name: pages

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - dev-site
      - data-guide-cases
      - dev-gov-local

# 允许把构建产物部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build static site
        run: python3 site/build_site.py --out public --base "/${GITHUB_REPOSITORY##*/}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 不绑定 environment：仓库的 github-pages environment 带自定义分支策略时，
    # 非白名单分支的 deploy job 会在启动前被拒（job 没有步骤就直接 failure）。
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
